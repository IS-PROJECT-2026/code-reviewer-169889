<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Reviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .dark .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">

    <main class="max-w-md mx-auto mt-20 p-6 rounded-lg shadow-md bg-white">

      <h1 class="text-2xl font-semibold text-gray-800 mb-2">Code Reviewer</h1>
      <p class="text-sm text-gray-500 mb-6">
        Enter a public GitHub repository URL to start a review.
      </p>

      <form id="repo-form" novalidate>

        <label
          for="repo-url"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          GitHub Repository URL
        </label>

        <input
          id="repo-url"
          type="url"
          name="repo-url"
          placeholder="https://github.com/username/project"
          autocomplete="off"
          spellcheck="false"
          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm
                 shadow-sm placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 focus:border-indigo-500 transition"
        />

        <!-- Validation error area -->
        <p
          id="url-error"
          role="alert"
          aria-live="polite"
          class="mt-1 text-sm text-red-600 min-h-[1.25rem]"
        ></p>

        <button
          id="submit-btn"
          type="submit"
          class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
                 disabled:opacity-60 disabled:cursor-not-allowed
                 text-white text-sm font-medium py-2 px-4 rounded-md
                 transition focus:outline-none focus:ring-2
                 focus:ring-indigo-500 focus:ring-offset-2"
        >
          Review Repo
        </button>

      </form>

    </main>

    <!-- Score Dashboard (Hidden by default) -->
    <section id="dashboard-section" class="hidden max-w-4xl mx-auto mt-8 mb-16 p-6 rounded-2xl shadow-xl glass-panel relative overflow-hidden">
      <!-- Decorative background glow -->
      <div class="absolute -top-32 -right-32 w-96 h-96 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
      <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
      
      <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
          <h2 class="text-sm font-semibold tracking-wider text-gray-500 uppercase">Analysis Results</h2>
          <h3 id="repo-name-display" class="text-2xl font-bold text-gray-900 mt-1 flex items-center gap-2">
            <i data-lucide="github" class="w-6 h-6"></i>
            <span>owner/repo</span>
          </h3>
        </div>
        
        <div class="flex flex-col items-center bg-white rounded-xl shadow-sm border border-gray-100 p-4 min-w-[140px]">
          <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Overall Score</span>
          <div id="overall-score" class="text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-gray-700 to-gray-900">
            --
          </div>
        </div>
      </div>

      <!-- Severity Badges -->
      <div class="relative z-10 flex flex-wrap gap-3 mb-10 pb-8 border-b border-gray-200">
        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-red-50 border border-red-100 text-red-700 font-medium text-sm transition hover:shadow-sm">
          <i data-lucide="alert-octagon" class="w-4 h-4 text-red-500"></i>
          <span>Critical</span>
          <span id="count-critical" class="ml-1 bg-red-100 text-red-800 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-orange-50 border border-orange-100 text-orange-700 font-medium text-sm transition hover:shadow-sm">
          <i data-lucide="alert-triangle" class="w-4 h-4 text-orange-500"></i>
          <span>High</span>
          <span id="count-high" class="ml-1 bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-yellow-50 border border-yellow-100 text-yellow-700 font-medium text-sm transition hover:shadow-sm">
          <i data-lucide="alert-circle" class="w-4 h-4 text-yellow-500"></i>
          <span>Medium</span>
          <span id="count-medium" class="ml-1 bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-blue-50 border border-blue-100 text-blue-700 font-medium text-sm transition hover:shadow-sm">
          <i data-lucide="info" class="w-4 h-4 text-blue-500"></i>
          <span>Low</span>
          <span id="count-low" class="ml-1 bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-green-50 border border-green-100 text-green-700 font-medium text-sm transition hover:shadow-sm">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>
          <span>Passed</span>
          <span id="count-passed" class="ml-1 bg-green-100 text-green-800 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </div>
      </div>

      <!-- Categories Grid -->
      <div class="relative z-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <!-- Security -->
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition hover:-translate-y-1 hover:shadow-md duration-300">
          <div class="flex justify-between items-center mb-4">
            <h4 class="font-semibold text-gray-700 flex items-center gap-2">
              <i id="icon-security" data-lucide="shield" class="w-5 h-5 text-gray-400 transition-colors duration-300"></i> Security
            </h4>
            <span id="score-security" class="text-2xl font-bold text-gray-900">--</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2">
            <div id="bar-security" class="bg-gray-400 h-2 rounded-full transition-all duration-1000 w-0"></div>
          </div>
        </div>

        <!-- Code Quality -->
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition hover:-translate-y-1 hover:shadow-md duration-300">
          <div class="flex justify-between items-center mb-4">
            <h4 class="font-semibold text-gray-700 flex items-center gap-2">
              <i id="icon-codequality" data-lucide="code" class="w-5 h-5 text-gray-400 transition-colors duration-300"></i> Code Quality
            </h4>
            <span id="score-codequality" class="text-2xl font-bold text-gray-900">--</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2">
            <div id="bar-codequality" class="bg-gray-400 h-2 rounded-full transition-all duration-1000 w-0"></div>
          </div>
        </div>

        <!-- Architecture -->
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition hover:-translate-y-1 hover:shadow-md duration-300">
          <div class="flex justify-between items-center mb-4">
            <h4 class="font-semibold text-gray-700 flex items-center gap-2">
              <i id="icon-architecture" data-lucide="layers" class="w-5 h-5 text-gray-400 transition-colors duration-300"></i> Architecture
            </h4>
            <span id="score-architecture" class="text-2xl font-bold text-gray-900">--</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2">
            <div id="bar-architecture" class="bg-gray-400 h-2 rounded-full transition-all duration-1000 w-0"></div>
          </div>
        </div>

        <!-- AI Code Smells -->
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition hover:-translate-y-1 hover:shadow-md duration-300">
          <div class="flex justify-between items-center mb-4">
            <h4 class="font-semibold text-gray-700 flex items-center gap-2">
              <i id="icon-aicodesmells" data-lucide="brain" class="w-5 h-5 text-gray-400 transition-colors duration-300"></i> AI Code Smells
            </h4>
            <span id="score-aicodesmells" class="text-2xl font-bold text-gray-900">--</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2">
            <div id="bar-aicodesmells" class="bg-gray-400 h-2 rounded-full transition-all duration-1000 w-0"></div>
          </div>
        </div>

        <!-- Performance -->
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition hover:-translate-y-1 hover:shadow-md duration-300 opacity-70">
          <div class="flex justify-between items-center mb-4">
            <h4 class="font-semibold text-gray-700 flex items-center gap-2">
              <i id="icon-performance" data-lucide="zap" class="w-5 h-5 text-gray-400 transition-colors duration-300"></i> Performance
            </h4>
            <span id="score-performance" class="text-2xl font-bold text-gray-900">--</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2">
            <div id="bar-performance" class="bg-gray-400 h-2 rounded-full transition-all duration-1000 w-0"></div>
          </div>
        </div>

      </div>

      <!-- Findings List -->
      <div id="findings-section" class="relative z-10 mt-12 pt-8 border-t border-gray-200">
        <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
          <i data-lucide="list-checks" class="w-6 h-6 text-gray-500"></i>
          Findings
        </h3>

        <!-- Filter Bar -->
        <div class="mb-6 p-4 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col lg:flex-row gap-6 justify-between items-start lg:items-center">
          
          <!-- Severity Filter -->
          <div class="flex flex-wrap items-center gap-2" id="severity-filters">
            <span class="text-xs font-bold text-gray-400 mr-2 uppercase tracking-wider">Severity</span>
            <button data-severity="All" class="filter-severity active px-4 py-1.5 text-sm font-semibold rounded-full transition-all bg-gray-800 text-white shadow-sm border border-transparent">All</button>
            <button data-severity="Critical" class="filter-severity px-4 py-1.5 text-sm font-medium rounded-full transition-all bg-white border border-red-200 text-red-700 hover:bg-red-50">Critical</button>
            <button data-severity="High" class="filter-severity px-4 py-1.5 text-sm font-medium rounded-full transition-all bg-white border border-orange-200 text-orange-700 hover:bg-orange-50">High</button>
            <button data-severity="Medium" class="filter-severity px-4 py-1.5 text-sm font-medium rounded-full transition-all bg-white border border-yellow-200 text-yellow-700 hover:bg-yellow-50">Medium</button>
            <button data-severity="Low" class="filter-severity px-4 py-1.5 text-sm font-medium rounded-full transition-all bg-white border border-blue-200 text-blue-700 hover:bg-blue-50">Low</button>
          </div>

          <!-- Category Filter -->
          <div class="flex items-center gap-3 w-full lg:w-auto">
            <label for="category-filter" class="text-xs font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap">Category</label>
            <select id="category-filter" class="w-full lg:w-48 bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 transition shadow-sm font-medium">
              <option value="All">All Categories</option>
              <option value="Security">Security</option>
              <option value="CodeQuality">Code Quality</option>
              <option value="Performance">Performance</option>
              <option value="Architecture">Architecture</option>
              <option value="AICodeSmells">AI Code Smells</option>
            </select>
          </div>
        </div>

        <div id="findings-list" class="space-y-4">
          <!-- Populated dynamically by JS -->
        </div>
      </div>

    </section>

    <!-- ESLint browser build – exposes window.eslint (Linter class) -->
    <script src="https://cdn.jsdelivr.net/npm/eslint-linter-browserify/linter.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
